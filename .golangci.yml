run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  misspell:
    ignore-words:
      - notificaiton

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
