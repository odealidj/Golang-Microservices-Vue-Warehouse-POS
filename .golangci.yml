version: "2"

linters:
  enable:
    - bodyclose
    - misspell
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    misspell:
      ignore-rules:
        - notificaiton
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
